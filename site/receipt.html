<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Your CBD Receipt</title>
<style>
body{margin:0;background:#e9e4d6;display:grid;place-items:center;min-height:100vh;font-family:ui-monospace,'Spline Sans Mono',Menlo,monospace}
.receipt{background:#fff;width:360px;padding:34px 30px;box-shadow:0 10px 40px rgba(0,0,0,.18);transform:rotate(-.5deg)}
h2{font-family:Georgia,serif;text-align:center;letter-spacing:.03em;margin-bottom:2px}
.sub{text-align:center;font-size:11px;color:#777;margin-bottom:20px}
.line{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px dashed #ccc}
.total{font-size:17px;font-weight:700;border-top:2px solid #111;margin-top:12px;padding-top:10px}
.save{color:#2e5c40;font-weight:700}
.bar{height:44px;margin:22px 0 6px;background:
 repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 5px,transparent 5px 9px)}
.note{text-align:center;font-size:11.5px;color:#555}
a.btn{display:block;text-align:center;margin-top:16px;background:#17150f;color:#faf7f0;text-decoration:none;padding:12px;font-size:13px}
</style></head>
<body>
<div class="receipt">
  <h2>SIMPLE TINCTURES</h2>
  <p class="sub">YOUR YEAR OF CBD — ITEMIZED</p>
  <div class="line"><span>Their tinctures (1 yr @ 40mg/day)</span><span id="their">$1,152.00</span></div>
  <div class="line"><span>Our concentrate + MCT (1 yr)</span><span>$207.00</span></div>
  <div class="total"><div style="display:flex;justify-content:space-between"><span>YOU KEEP</span><span class="save" id="kept">$945.00</span></div></div>
  <div class="bar"></div>
  <p class="note">Same milligrams. Same routine.<br>You just stopped paying someone to pour oil.</p>
  <a class="btn" href="/">Do your own receipt → simpletinctures.com</a>
</div>
<script>
const p=parseFloat(new URLSearchParams(location.search).get("ppmg"))||0.08;
const MG_YR=40*30*12; /* 14,400 mg/yr at 40 mg/day */
const their=Math.round(MG_YR*p);
const ours=Math.round(127*1.5+24); /* 1.5 pouches/yr + MCT */
document.getElementById("their").textContent="$"+their.toLocaleString()+".00";
document.getElementById("ours")&& (document.getElementById("ours").textContent="$"+ours.toLocaleString()+".00");
document.getElementById("kept").textContent="$"+Math.max(0,their-ours).toLocaleString()+".00";
</script>
</body></html>
